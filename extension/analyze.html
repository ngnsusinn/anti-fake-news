<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phân tích bài viết</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="analyze.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Phân tích bài viết</h1>
      <p id="source" hidden></p>
    </header>

    <form id="analysis-form" novalidate>
      <section aria-labelledby="article-heading">
        <h2 id="article-heading">Bài viết</h2>
        <p id="extraction" class="notice" role="status">Đang đọc phiên phân tích…</p>
        <fieldset id="draft" disabled>
          <label for="title">Tiêu đề (không bắt buộc)</label>
          <input id="title" type="text" aria-describedby="form-status">
          <label for="text">Nội dung bài viết</label>
          <p class="field-hint" id="text-limit">Tối đa 50.000 ký tự.</p>
          <textarea id="text" rows="10" aria-describedby="text-limit form-status"></textarea>
        </fieldset>
      </section>

      <section aria-labelledby="image-heading">
        <h2 id="image-heading">Ảnh đính kèm</h2>
        <div id="image-candidates" hidden>
          <p>Ảnh tìm thấy trên trang</p>
          <ul id="candidates"></ul>
        </div>
        <label for="image-upload">Tải tệp JPEG hoặc PNG</label>
        <input id="image-upload" type="file" accept="image/jpeg,image/png" aria-describedby="image-status form-status">
        <p id="image-status" role="status"></p>
        <img id="image-preview" alt="Ảnh đã chọn để phân tích" hidden>
        <button id="remove-image" type="button" hidden>Bỏ ảnh</button>
      </section>

      <section aria-labelledby="connection-heading">
        <h2 id="connection-heading">Kết nối Backend</h2>
        <label for="endpoint">Địa chỉ Backend cục bộ</label>
        <input id="endpoint" type="url" value="http://127.0.0.1:8000" autocomplete="off">
        <label for="demo-token">Token demo</label>
        <input id="demo-token" type="password" autocomplete="off">
        <label for="timeout">Thời gian chờ (mili giây)</label>
        <input id="timeout" type="number" value="30000" min="1000" max="120000" step="1">
        <button id="check-health" type="button">Kiểm tra kết nối</button>
      </section>

      <section aria-label="Phân tích">
        <p id="form-status" role="status"></p>
        <p id="analysis-status" role="status"></p>
        <div class="analysis-actions">
          <button id="analyze" type="submit">Phân tích</button>
          <button id="retry" type="button" aria-describedby="analysis-status" hidden>Thử lại</button>
        </div>
      </section>
    </form>

    <section id="result" aria-labelledby="result-heading" hidden>
      <h2 id="result-heading">Kết quả phân tích</h2>
      <p id="result-detail"></p>
    </section>
  </main>
</body>
</html>
